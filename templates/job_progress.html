<div hx-ext="sse" sse-connect="/sse/jobs/{{.VideoID}}">

  <div class="card">
    <div class="pipeline-header">
      <span class="job-id" id="job-id-label">{{.VideoID}}</span>
      <span class="muted" id="pct-label">0%</span>
    </div>
    <progress value="0" max="100" id="job-progress"></progress>
  </div>

  <div class="card" id="timeline">
    <p class="muted">Waiting for pipeline events...</p>
  </div>

  <div class="card" id="results" style="display:none"></div>

</div>
